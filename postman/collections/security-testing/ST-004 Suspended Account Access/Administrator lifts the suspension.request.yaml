$kind: http-request
id: d656e6de-b9d7-45d3-8ef3-3e723ea46f1d
url: "{{baseUrl}}/api/admin/students/{{studentId}}/suspension"
method: PATCH
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "suspended": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('lifted', () => pm.response.to.have.status(200));
      pm.test('the record says so', () => pm.expect((pm.response.json().student || pm.response.json()).suspended).to.not.be.true);
    language: text/javascript
order: 5000
